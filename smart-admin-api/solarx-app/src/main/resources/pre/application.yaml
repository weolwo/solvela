#############################################################################################################
#                                                                                                           #
# 本文件是 solarx-app 的独有配置，通用配置在 sa-base 的 sa-base.yaml 里（数据库、Redis、sa-token、文件…）。   #
# 此处的配置会覆盖 sa-base.yaml 中的同名项，合并逻辑见类：YamlProcessor.java                                   #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solarx-app
  log-directory: /home/logs/smart_admin_v3/${project.name}/${spring.profiles.active}

# 项目端口和url根路径
server:
  port: 1025
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# 这里原先有一段 smart.job（role: NONE），用来阻止本进程执行定时任务。
# 2026-08-25 job 模块整体移交 sa-admin 之后已经删除 —— 本服务的 classpath 上
# 根本没有调度器、执行池和任何 SmartJob 实现类，不存在"会不会跑"的问题了。
# 从"靠配置约束"变成"物理上不具备"，这才是想要的形态。
#
# ⚠️ sa-base 只保留了 jobspi（SmartJob 接口 / @SmartJobHandler 等 6 个 SPI 类），
#    是给业务模块实现任务用的，本身不含任何执行逻辑。
# -------------------------------------------------------------------------
# 环境
spring:
  profiles:
    active: '@profiles.active@'
