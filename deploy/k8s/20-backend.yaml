metadata: { name: app-biz, namespace: solvela }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: app-biz } }
  template:
    metadata:
      labels: { app: app-biz }
    spec:
      initContainers:
        - name: wait-mysql
          image: mysql:8.4
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "等 MySQL 真的建好…"
                sleep 3
              done
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: solvela-secret, key: MYSQL_ROOT_PASSWORD } }
        - name: wait-redis
          image: redis:8-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; do
                echo "等 Redis…"
                sleep 3
              done
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: solvela-secret, key: REDIS_PASSWORD } }
      containers:
        - name: app-biz
          image: solvela-app-biz:3.0.0-distroless
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: solvela-env }
            - secretRef:    { name: solvela-secret }
          env:
            - { name: HEALTH_URL, value: "http://127.0.0.1:1026/" }
          ports:
            - { containerPort: 1026, name: http }
            - { containerPort: 2026, name: metrics }
          volumeMounts:
            - { name: logs, mountPath: /home/logs }
          startupProbe:
            exec: { command: ["/opt/jre/bin/java","-XX:TieredStopAtLevel=1","-cp","/opt/probe","HealthCheck"] }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["/opt/jre/bin/java","-XX:TieredStopAtLevel=1","-cp","/opt/probe","HealthCheck"] }
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { memory: 640Mi, cpu: 200m }
            limits:   { memory: 1Gi }
      volumes:
        - { name: logs, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: app-gateway, namespace: solvela }
spec:
  selector: { app: app-gateway }
  ports:
    - { name: http,    port: 1025, targetPort: 1025 }
    # metrics 端口刻意【只在 Service 上开，不给 NodePort】——
    # 只有集群内的 Prometheus 碰得到。理由见各模块 application.yaml 的 management 段。
    - { name: metrics, port: 2025, targetPort: 2025 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-gateway, namespace: solvela }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: app-gateway } }
  template:
    metadata:
      labels: { app: app-gateway }
    spec:
      initContainers:
        # 网关没有数据库驱动（2026-09-01 摘掉了全部 base 模块），只等 Redis 和 app-biz
        - name: wait-redis
          image: redis:8-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; do
                echo "等 Redis…"
                sleep 3
              done
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: solvela-secret, key: REDIS_PASSWORD } }
        - name: wait-app-biz
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z app-biz 1026; do
                echo "等 app-biz…"
                sleep 3
              done
      containers:
        - name: app-gateway
          image: solvela-app:3.0.0-distroless
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: solvela-env }
            - secretRef:    { name: solvela-secret }
          env:
            - { name: HEALTH_URL, value: "http://127.0.0.1:1025/" }
          ports:
            - { containerPort: 1025, name: http }
            - { containerPort: 2025, name: metrics }
          volumeMounts:
            - { name: logs, mountPath: /home/logs }
          startupProbe:
            exec: { command: ["/opt/jre/bin/java","-XX:TieredStopAtLevel=1","-cp","/opt/probe","HealthCheck"] }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["/opt/jre/bin/java","-XX:TieredStopAtLevel=1","-cp","/opt/probe","HealthCheck"] }
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits:   { memory: 768Mi }
      volumes:
        - { name: logs, emptyDir: {} }
