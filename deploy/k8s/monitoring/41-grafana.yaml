# =============================================================================
# Grafana。数据源和面板都 provisioning 进去，开浏览器就能看，不用手点
# =============================================================================
# 面板里刻意【没有】JVM / HTTP 那一排 —— 应用没有 actuator，抓不到。
# 理由与补法见 40-prometheus.yaml 开头。
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: solvela }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: solvela
        orgId: 1
        folder: Solvela
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
# 面板定义【不在这里】。两边共用 deploy/monitoring/dashboards/ 下那两个 json：
#   solvela-app.json  应用与中间件层，compose 与 k8s 共用
#   solvela-k8s.json  Pod / 节点层，只有 k8s 有数据源
# ConfigMap 由 setup.sh 用 --from-file 现建 —— 和 nginx.conf、两个基线同一个路子：
# 仓库里只留一份定义，不留第二份会静默漂移的拷贝。
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: solvela }
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000, nodePort: 30300 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: solvela }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        # 官方镜像以 472 跑；emptyDir 默认 root 所有，不给 fsGroup 就写不进 sqlite
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: solvela-secret, key: GRAFANA_ADMIN_PASSWORD } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            # 装插件要出网，体验集群不指望它
            - { name: GF_INSTALL_PLUGINS, value: "" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards }
            # 🔴 顺序要紧：/var/lib/grafana 必须排在 /var/lib/grafana/dashboards
            #    【前面】。容器运行时按声明顺序挂载，父目录后挂会把子挂载整个盖掉 ——
            #    表现是 Grafana 起得来、数据源有、面板一个都没有，而且不报错。
            - { name: data,            mountPath: /var/lib/grafana }
            - { name: dashboards,      mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits:   { memory: 512Mi }
      volumes:
        # 同一个 ConfigMap 挂两次，各取一个文件 —— provisioning 的两个目录
        # Grafana 是分开读的，混在一个目录里它会把 datasources.yaml 当面板解析
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items: [{ key: datasources.yaml, path: datasources.yaml }]
        - name: provisioning-db
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: data, emptyDir: {} }
