# ===========================================================================
# 本地调试用：把两个站露到【回环地址】上，好用浏览器直接看。
# ===========================================================================
#
#     docker compose -f docker-compose.yml -f deploy/compose.local-ports.yml up -d web
#
#     C 端    http://127.0.0.1:8080
#     管理端  http://127.0.0.1:8081
#
# 🔴 为什么单独一个文件，而不是直接写进 docker-compose.yml：
#
#    主文件里 web 没有 ports，那不是遗漏 —— 它是 nginx 那份真实 IP 归一化
#    成立的前提（见 deploy/nginx/snippets/proxy-upstream.conf）。
#    只有「外面唯一进得来的路是 cloudflared」，CF-Connecting-IP 才必然是
#    Cloudflare 写的；一旦 web 对外可达，任何人都能自己发一个那个头，
#    把 IP 伪造成任意值。
#
#    写进主文件再靠注释提醒「上线前记得删」，是注定会被忘掉的那种约定。
#    单独一个文件、且必须在命令行里显式点名，忘不掉 —— 不加 -f 它就不生效。
#
# ⚠️ 前缀 127.0.0.1 不能去掉。写成 "8080:8080" 会绑到 0.0.0.0，
#    同一个局域网里的任何设备都能直连，上面那条保证就没了。
services:
  web:
    ports:
      - "127.0.0.1:8080:8080"   # C 端
      - "127.0.0.1:8081:8081"   # 管理端
