# ===========================================================================
# 静态站 + 反向代理。整套部署里唯一对外的入口（对外的那一跳是 cloudflared）。
# ===========================================================================
#
# 🔴 这份配置里【没有任何域名】。
#
# 两个站靠【监听端口】区分，不靠 server_name：
#     :8080 → C 端      （cloudflared 把 app.<域名>   指过来）
#     :8081 → 管理端    （cloudflared 把 admin.<域名> 指过来）
#
# 按 server_name 匹配的话，域名会同时出现在 cloudflared 配置和这里，
# 改域名要改两处；而漏改一处的表现是【静默走到 default_server】——
# 访问管理端域名却打开了 C 端首页，没有任何报错。
# 用端口区分之后，域名只存在于 cloudflared/config.yml 一个地方。
#
# 另一个好处：「管理端和 C 端是两个站」这件事变成了物理隔离，
# 而不是一次字符串匹配的结果。
# ===========================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志里把两个 IP 都留下：$remote_addr 是 cloudflared 容器的地址（永远一样，没用），
    # 后面那个才是真实访客。排查「后端记的 IP 不对」时，一眼就能看出是哪一跳丢的。
    log_format tunnel '$remote_addr cf=$http_cf_connecting_ip '
                      '$status $request_time "$request" "$http_user_agent"';
    access_log /dev/stdout tunnel;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65;

    # 上传体积。file.storage.max-file-size-kb 默认 10240（10MB），这里留一倍余量。
    # ⚠️ nginx 默认只有 1m —— 不改的话超过 1MB 的图会被 nginx 直接挡掉，
    #    报的是 413，而后端的大小校验和错误提示根本没机会执行。
    client_max_body_size 20m;

    # -----------------------------------------------------------------------
    # 🔴 Docker 内置 DNS。下面每个 proxy_pass 都写成【变量】形式，就是为了它。
    #
    # proxy_pass 里直接写主机名（proxy_pass http://admin:1024/）时，
    # nginx 是在【加载配置时】解析一次 DNS，然后把 IP 记死：
    #
    #   · 启动顺序变成硬依赖 —— 后端还没起来，nginx 直接启动失败退出；
    #   · 后端容器重启换了 IP，nginx 还在往旧 IP 打，全站 502，
    #     而 nginx 自己没有任何错误，日志里只有 connect() failed。
    #     这个坑最难受的地方是：重启 nginx 就好了，于是很容易被当成偶发。
    #
    # 写成变量之后，解析推迟到【每个请求】，由这里的 resolver 负责，valid=30s 缓存。
    # 代价是变量形式的 proxy_pass 不会自动剥前缀，所以要剥的地方得显式 rewrite。
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;

    # -----------------------------------------------------------------------
    # C 端：app.<域名>
    # -----------------------------------------------------------------------
    server {
        listen 8080 default_server;
        root   /srv/app;
        index  index.html;

        # 浏览器安全头 + C 端 CSP（Report-Only）。
        # 🔴 add_header 不叠加继承：下面自带 add_header 的 location（/assets/）里要再 include 一次
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;

        # ⚠️ ^~ 不能去掉：它让这个前缀匹配【中止】后面的正则匹配。
        #    没有它的话，/api/xxx.js 这种请求会掉进静态资源那条规则里当文件找，
        #    结果是接口返回 404 而不是被转发。
        location ^~ /api/ {
            include /etc/nginx/snippets/proxy-upstream.conf;
            # C 端网关没有任何上传接口，最大的合法请求体（收货地址、滑块轨迹）不到 10KB。
            # 上面那个 20m 是给管理端上传图片的，这里收到 64k：超出的直接 413，不让网关去读、去解析
            #（网关方案 §5.6；网关自己的 JSON 解析也按 64KB 封顶，见 InboundJsonConfig —— 那一道管的是没有 nginx 的环境）
            client_max_body_size 64k;
            # 剥掉 /api 前缀：/api/auth/login → /auth/login。
            # 网关的 context-path 是 /，前端的 VITE_API_BASE_URL 是 /api，
            # 两边靠这一行对上。少了它后端收到的是 /api/auth/login → 全部 404。
            #
            # （用 rewrite 而不是 proxy_pass 结尾加斜杠，是因为下面那行带变量 ——
            #   带变量的 proxy_pass 不会自动剥前缀。理由见 http 块里 resolver 那段。）
            # 🔴 set 必须在 rewrite 【前面】。
            #    `rewrite ... break` 会中止 rewrite 阶段的后续指令，而 set 正是
            #    rewrite 模块的指令 —— 写在后面就永远不会执行，变量是空的。
            #    表现：nginx -t 通过、启动正常，一发请求就 500，
            #    错误日志里是 `using uninitialized "xxx" variable`
            #    加一句 `invalid URL prefix in "http://"`。2026-09-12 实测踩到。
            set $upstream_gateway app-gateway:1025;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_gateway;
        }

        # 图片。storageKey 不可变，所以后端敢发 immutable 缓存头（见 FileController）。
        # 这条路由指向【管理端进程】—— 文件模块在那里，C 端只是读。
        location ^~ /support/file/public/ {
            include /etc/nginx/snippets/proxy-upstream.conf;
            # 路径原样透传，不用 rewrite
            set $upstream_admin_files admin:1024;
            proxy_pass http://$upstream_admin_files;
        }

        # 带 hash 的构建产物，可以永久缓存。C 端是 vite 默认布局，产物全在 /assets/ 下。
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # 自带 add_header 就不再继承 server 级的 —— 安全头要在这里再挂一次
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-app.conf;
            # 🔴 文件不存在就回 404，不要落到下面 location / 的 try_files 被兜成 index.html。
            #    理由（以及它在线上长什么样）见管理端那条同款规则。
            try_files $uri =404;
        }

        # 🔴 index.html 不许缓存：它是 SPA 的入口，里面写死了带 hash 的 chunk 文件名。
        #    没有这一条时 nginx 只发 ETag/Last-Modified、不发 Cache-Control，浏览器会按
        #    「启发式缓存」自己决定存多久（通常是 Last-Modified 距今的 10%）——
        #    于是重新部署之后，老浏览器还拿着缓存里的旧 index.html 去取已经不存在的 chunk。
        location = /index.html {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-app.conf;
        }

        # 🔴 service worker 与 manifest 必须每次回源确认（no-cache = 可以存，但用前先问）。
        #    浏览器检查 SW 更新时虽然默认绕过 HTTP 缓存，但 Cloudflare 这类中间层不认这个约定；
        #    sw.js 被哪一层缓存住，改了缓存策略的新 SW 就迟迟到不了用户手上。
        #
        #    ⚠️ 2026-10-22 实测：这一行【在 Cloudflare 后面不生效】。边缘按扩展名缓存 .js，
        #    并用区域的 Browser Cache TTL（当前 4 小时）盖掉源站的 Cache-Control ——
        #    `curl -D- https://app.<域名>/sw.js` 回的是 max-age=14400，直连容器才是 no-cache。
        #    影响面有限（旧 SW 照常工作，只是新 SW 最多晚 4 小时铺开），但要真守住得在
        #    Cloudflare 侧配：Caching → Configuration → Browser Cache TTL 改成
        #    “Respect Existing Headers”，或给 /sw.js 加一条 Bypass Cache 的 Cache Rule。
        #    index.html（no-store）与 /assets/（immutable）都没被改，已实测。
        #    try_files 同 /assets/：文件不在就 404，不能被兜成 index.html —— 把 HTML 注册成 SW 会直接失败。
        location = /sw.js {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-app.conf;
            try_files $uri =404;
        }

        # nginx 自带的 mime.types 里没有 .webmanifest，不写的话按 default_type 发成 octet-stream
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp-app.conf;
            try_files $uri =404;
        }

        # 🔴 history 路由必须有 try_files：app-web 用的是 createWebHistory，
        #    用户在 /orders 刷新时浏览器是真的去请求 /orders 这个路径，
        #    没有这一行就是 404 —— 而且只在「刷新/直接打开链接」时出现，
        #    站内点着走一切正常，极易漏测。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 探测 /.env、/.git 这类路径的回 404，不再被上面兜成首页 200
        include /etc/nginx/snippets/deny-hidden.conf;
    }

    # -----------------------------------------------------------------------
    # 管理端：admin.<域名>。前面还有一层 Cloudflare Access，见 deploy/README.md
    # -----------------------------------------------------------------------
    server {
        listen 8081;
        root   /srv/admin;
        index  index.html;

        # ===================================================================
        # 🔴 管理端第一道门：HTTP Basic Auth，在【看到任何东西之前】。
        # ===================================================================
        # 写在 server 级 = 覆盖下面每一个 location：静态站、/api、构建产物全都要先过密码。
        # 爬虫/扫描器直接拿到 401，连管理端的 HTML、连 /api/login 接口都摸不到 ——
        # 这一层挡在应用的登录之前，是「网络可达性」层面的封锁，不是「业务鉴权」。
        #
        # 口令文件【挂载进来，不进镜像、不进仓库】：写进镜像等于把口令随镜像分发，
        # 写进仓库等于提交明文。文件缺失时 nginx 启动会失败（找不到 auth_basic_user_file）——
        # 这是刻意的：宁可起不来，也不要「以为加了密码其实没加」。
        # 生成见 deploy/README.md（htpasswd -B，bcrypt）。
        #
        # ⚠️ Basic Auth 的口令是每次请求都带、base64 明文传输 —— 全靠外层
        #    Cloudflare 的 HTTPS 才不至于被中间人看到。所以它只是「挡住未授权访问」，
        #    不能替代应用自己的登录（那之后还有 admin 账号密码 + 等保失败锁定）。
        auth_basic           "Solvela Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;

        # 浏览器安全头（HSTS、nosniff、防点击劫持）。管理端暂不挂 CSP：它的富文本编辑器等
        # 第三方组件对脚本 / 样式来源的要求还没摸清，C 端那份 Report-Only 跑稳之后再单独评估。
        # 🔴 同 C 端：下面自带 add_header 的 location（构建产物、index.html）里要再 include 一次
        include /etc/nginx/snippets/security-headers.conf;

        location ^~ /api/ {
            include /etc/nginx/snippets/proxy-upstream.conf;
            # set 必须在 rewrite 前面，理由见 C 端那个 location
            set $upstream_admin admin:1024;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_admin;
        }

        # 带 hash 的构建产物，可以永久缓存。
        #
        # 🔴 管理端【根本没有 /assets/ 目录】：vite.config.js 把 rollup 的输出改成了按类型分目录
        #    （chunkFileNames: 'js/[name]-[hash].js'、assetFileNames: '[ext]/[name]-[hash].[ext]'），
        #    产物落在 js/、css/、png/ …… 下面。这里原先照抄 C 端写的 `^~ /assets/`
        #    匹配不到任何一个文件 —— 等于管理端从来没有缓存规则，也没有下面那条 =404。
        #    所以改成按【目录名 = 扩展名】匹配：这些目录里的文件名全都带 hash，
        #    而不带 hash 的 index.html、favicon.ico 在根目录，碰不到这条规则。
        location ~* ^/(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            # 🔴 文件不存在就回 404，不要落到 location / 的 try_files 被兜成 index.html。
            #    2026-10-18 线上现象：重新部署后，开着的老页面点「风控规则」转半天打不开，
            #    控制台只有一句 Failed to fetch dynamically imported module
            #    .../js/risk-rule-list-<旧 hash>.js。
            #    真实原因是那个 chunk 随新镜像换了 hash，而请求它拿回来的是一份
            #    200 + text/html 的首页 —— 浏览器按 nosniff 拒绝把它当模块执行，
            #    于是报成「取不到模块」而不是「文件没了」，把人往「网络慢」的方向带。
            try_files $uri =404;
        }

        # index.html 不许缓存，理由同 C 端那条（旧入口 → 旧 chunk 名 → 404）。
        location = /index.html {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # admin-web 用的是 hash 路由（#/xxx），服务端只会看到 /，
        # 所以这里其实用不上 try_files。仍然写上是为了万一将来换成 history 路由
        # 不会留下一个「刷新就 404」的坑。
        location / {
            try_files $uri $uri/ /index.html;
        }

        include /etc/nginx/snippets/deny-hidden.conf;
    }
}
