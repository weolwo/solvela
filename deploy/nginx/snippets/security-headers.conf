# ===========================================================================
# 浏览器安全响应头（C 端与管理端共用）。原理见 docs/知识库/Web鉴权-Cookie与浏览器安全边界.md §4。
# ===========================================================================
#
# 🔴 nginx 的 add_header【不叠加继承】：某个 location 里只要自己写了一条 add_header
#    （比如 /assets/ 的 Cache-Control），server 级的 add_header 在那个 location 里就【全部失效】。
#    所以本文件要在 server 级 include 一次，并在每个自带 add_header 的 location 里【再 include 一次】。
#    漏了的表现是静默的：那个 location 的响应上就是没有这些头，页面照常工作。
#
# 全部带 always：否则只在 2xx/3xx 上发，4xx/5xx 的错误页就没有这些头。

# 强制 HTTPS。浏览器记住之后，哪怕用户手敲 http:// 也直接走 HTTPS，不给中间人第一跳的机会。
# ⚠️ 刻意不带 includeSubDomains / preload：那会强制【所有】子域走 HTTPS，且 preload 几乎撤不回来。
#    确认 taozicn.me 下每个子域都只走 HTTPS 之后再加。
# 浏览器只在 HTTPS 响应上认这个头；本地 http 访问时它被忽略，无害。
add_header Strict-Transport-Security "max-age=31536000" always;

# 不许浏览器「猜」内容类型：一个被当成图片上传的文件，不能因为内容长得像 JS 就被当脚本执行。
add_header X-Content-Type-Options "nosniff" always;

# 跨站跳转时只带源、不带完整路径（路径里可能有 token、订单号）。现代浏览器默认如此，写明是为了不依赖默认。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 防点击劫持：不许别的网站用 iframe 嵌我们的页面、诱导用户点击。
# 🔴 这两条是【强制执行】的，不在 Report-Only 里：frame-ancestors 放在 Report-Only 策略里会被浏览器直接忽略。
#    CSP frame-ancestors 是标准做法，X-Frame-Options 给不认它的老浏览器兜底。
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
