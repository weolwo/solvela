# ===========================================================================
# C 端的内容安全策略（CSP）—— 当前是 Report-Only：只上报违规，不拦截。
# ===========================================================================
#
# 它是 XSS 的第二道防线：就算有 HTML 混进页面（比如后台富文本 v-html 渲染时带进来的
# <img onerror=...>），浏览器也拒绝执行内联脚本、外域脚本。原理见知识库《Web鉴权》§4.2。
#
# 每一项为什么这么写：
#   script-src 'self'        只认同源脚本文件。🔴 不能加 'unsafe-inline' —— 加了这道防线就等于没有。
#                            index.html 原来那段内联主题脚本因此搬成了 /theme-init.js
#   style-src 'unsafe-inline'  后台富文本里带 style="..." 排版，禁掉版式会乱。CSS 注入的危害远小于脚本
#   img-src https:           商品图、富文本图可能在 app. 以外的域（apex 域访问时图在 app. 上；运营也可能贴外链）。
#                            图片不能执行代码，放开风险低
#   connect-src 'self'       接口全走同源 /api
#   object-src 'none'        不许 <object>/<embed>（老插件型攻击面）
#   base-uri 'self'          不许注入 <base> 把相对路径全部劫走
#   form-action 'self'       表单只能提交回自己
#   report-uri               违规报告发到网关 /csp-report，打进日志（有限流），搜【CSP 违规】
#
# 🔴 上线步骤：先 Report-Only 跑一段时间，看网关日志里的【CSP 违规】都是什么 ——
#    真实用户的浏览器插件、Cloudflare 注入的脚本（Rocket Loader、Web Analytics 等）都可能出现在这里。
#    确认没有自己的资源被误报之后，把下面的 Content-Security-Policy-Report-Only 改成 Content-Security-Policy。
#    回退 = 改回 Report-Only。
#
# ⚠️ 与 security-headers.conf 里那条强制的 CSP（只含 frame-ancestors）并存不冲突：
#    浏览器对多条 CSP 各自独立执行，Report-Only 那条只上报。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
