# ===========================================================================
# 转发给后端进程时统一加的头。**每一个 proxy_pass 都必须 include 这个文件。**
# ===========================================================================
#
# 🔴 这里最要紧的一段：把真实 IP 归一化，让后端拿到的 X-Forwarded-For 可信。
#
# ClientIp 与 SolvelaServletUtil 的注释里都写着同一句话：
#     「只有当入口网关【覆盖】（而不是追加）这个头时，第一段才可信」
# 这个文件就是那个「覆盖」。
#
# 为什么非做不可：Cloudflare 对 X-Forwarded-For 是【追加】的。
# 客户端自己发一个 `X-Forwarded-For: 1.2.3.4`，到后端就变成
#     X-Forwarded-For: 1.2.3.4, <真实IP>
# 而两处取 IP 的代码取的都是【第一段】—— 正好取到伪造值。
# 后果是登录日志、IP 归属地、风控信号全部可以被任意一个访客随手污染，
# 而且不留任何痕迹：请求成功，日志里也是一个长得很正常的 IP。
#
# CF-Connecting-IP 则不同：它由 Cloudflare 边缘【强制覆写】，
# 客户端发什么都会被丢掉。所以用它去覆盖 XFF，第一段就真的是客户端了。
#
# ⚠️ 这个前提是「nginx 只可能被 cloudflared 访问到」。
#    docker-compose.yml 里 web 服务【不发布任何端口】正是为此 ——
#    一旦把 80 端口映到宿主机并对外开放，任何人都能绕过 Cloudflare 直接
#    发一个 CF-Connecting-IP 头进来，这一段的保证就没了。
proxy_set_header X-Forwarded-For      $http_cf_connecting_ip;
proxy_set_header X-Real-IP            $http_cf_connecting_ip;
#
# 另外四个头也要一并清掉，否则这个「覆盖」是有洞的：
# 两处取 IP 的代码都是【按顺序找第一个有值的头】。CF-Connecting-IP 缺失时
# （比如有人绕过隧道直连），上面两行会把 XFF / X-Real-IP 置空，
# 于是顺位就轮到了下面这几个 —— 而它们是客户端可以随便写的。
#
# 值为空串时 nginx 不会把该头传给上游，等于删除。
# （HTTP_ 开头那两个带下划线，nginx 默认的 underscores_in_headers off
#   本来就会丢弃它们；这里写出来是为了让「四个头都堵上」这件事在文件里是可见的，
#   而不是依赖一个随时可能被人打开的默认值。）
proxy_set_header Proxy-Client-IP      "";
proxy_set_header WL-Proxy-Client-IP   "";
proxy_set_header HTTP_CLIENT_IP       "";
proxy_set_header HTTP_X_FORWARDED_FOR "";

# ⚠️ 上面这份头清单必须与 Java 侧的清单【逐个对上】。
#    漏掉一个的表现是「那个头又可以伪造了」，而且没有任何症状。
#    所以有两条测试盯着它：
#        solvela-app/src/test/.../ClientIpHeaderCoverageTest.java
#        solvela-admin/src/test/.../ClientIpHeaderCoverageTest.java
#    它们读的就是这个文件。加头、改名、挪位置都会让它们红。

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
# 隧道到 nginx 这一跳是明文 HTTP，但用户那一侧是 HTTPS（Cloudflare 边缘终止 TLS）。
# 写死 https 而不是透传 $http_x_forwarded_proto：后者同样是客户端可伪造的。
proxy_set_header X-Forwarded-Proto https;

# 复用到上游的长连接，省掉每个请求一次 TCP 握手
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
