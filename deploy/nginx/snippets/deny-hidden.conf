# 以 . 开头的路径段（/.env、/.git/config、/.aws/credentials ……）一律 404。
#
# 为什么要它：镜像里本来就没有这些文件，但 `location /` 的 try_files 会把一切找不到的路径
# 兜给 index.html 并回 200。扫描器看到 200 会以为「命中了」、继续深挖，日志里也满屏假阳性
# （2026-09-27 上线当天 4 小时里就有 3 个扫描器、300 多条这类请求，全是 200）。
#
# 只拦 server 级 `location /` 兜底的那部分：/api/、/assets/ 都是 ^~ 前缀匹配，
# nginx 命中 ^~ 后不再看正则 —— 所以这条正则碰不到后端接口，也碰不到静态资源。
#
# /.well-known/ 放行：那是 security.txt、证书校验等约定俗成的公开目录。
location ~ /\.(?!well-known/) {
    return 404;
}
