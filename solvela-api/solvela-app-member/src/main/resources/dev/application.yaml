#############################################################################################################
#                                                                                                           #
# 本文件是 solvela-app-member（会员服务）的独有配置。                                                           #
# 通用配置在 solvela-base-core 的 solvela-base.yaml 里（数据库、Redis、文件…），此处同名项会覆盖它。              #
#                                                                                                           #
# 本服务装的是：会员、会话、资产(ledger)、提案与优惠配置(risk)、发奖派发(consumer)。                             #
#                                                                                                           #
# 与 admin / app / marketing 连的是【同一个库、同一个 Redis】—— 第一步只拆进程，不拆数据。                       #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-app-member
  log-directory: ${localPath:/home}/logs/solvela/${project.name}/${spring.profiles.active}

# 端口按服务顺排：admin 1024 / app 1025 / marketing 1026 / member 1027。
# 别改成随手一个号 —— 网关的转发规则、运维的防火墙白名单都是照着这几个号写的。
server:
  port: 1027
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# 本服务【不开】定时任务。四个进程连同一个库，@Scheduled 每多开一个进程就多跑一遍 ——
# 发奖、结算重复执行，而多发的那一份没人会主动来报。定时任务归 solvela-admin 独占。
# -------------------------------------------------------------------------

# 环境
spring:
  profiles:
    active: '@profiles.active@'

# ---------------------------------------------------------------------------
# 会员会话：本服务是会话存储的所有者（签发在网关，吊销在这里 —— 后台冻结会员时要用）
# ---------------------------------------------------------------------------
solvela:
  member:
    session:
      token-ttl: 30d
      max-sessions: 10
