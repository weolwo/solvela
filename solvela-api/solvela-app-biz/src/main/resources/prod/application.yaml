#############################################################################################################
#                                                                                                           #
# 本文件是 solvela-app-biz（C 端业务服务）的独有配置。                                                        #
# 通用配置在 solvela-base-core 的 solvela-base.yaml 里（数据库、Redis、文件…），此处同名项会覆盖它。              #
#                                                                                                           #
# 本服务装的是：会员与会话、营销（活动/抽奖/任务/彩票/商城）、奖品与发奖派发、资产(ledger)、提案与优惠配置(risk)。
#                                                                                                           #
# 与 admin / app 连的是【同一个库、同一个 Redis】—— 第一步只拆进程，不拆数据。
# 所以凡是「全局只该有一个执行者」的东西都不能在这里开，见下面的定时任务说明。                                    #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-app-biz
  log-directory: ${localPath:/home}/logs/solvela/${project.name}/${spring.profiles.active}

# 端口按服务顺排：admin 1024 / app 1025(网关) / biz 1026。
# （1027 是已撤销的 member 服务，别复用这个号）
# 别改成随手一个号 —— 网关的转发规则、运维的防火墙白名单都是照着这几个号写的。
server:
  port: 1026
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# 本服务【不开】定时任务。
# 四个进程连同一个库，@Scheduled 每多开一个进程就多跑一遍 ——
# 发奖、结算重复执行，而多发的那一份没人会主动来报。
# 定时任务归 solvela-admin 独占。
# -------------------------------------------------------------------------

# 环境
spring:
  profiles:
    active: '@profiles.active@'

# ---------------------------------------------------------------------------
# RabbitMQ：账号密码走环境变量 —— 生产配置里不写明文口令
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 会员会话：本服务是会话存储的所有者（签发在网关，吊销在这里 —— 后台冻结会员时要用）。
# 2026-08-31 随 solvela-app-member 撤销搬过来
# ---------------------------------------------------------------------------
solvela:
  member:
    session:
      token-ttl: 30d
      max-sessions: 10

spring.rabbitmq:
  host: ${RABBITMQ_HOST:127.0.0.1}
  port: ${RABBITMQ_PORT:5672}
  # 🔴 给了空默认值，是因为本服务当前【零发布、零消费】（见 MqConfig 类注释：
  #    发奖那条链路合并进程后已是进程内调用，拓扑声明连同 6 个 bean 一并删了）。
  #    没有默认值时这两行会让应用【启动即失败】—— 为一个没人用的 broker 立一道
  #    必须翻越的墙，结果只会是部署时被迫起一个 389MB 的空 RabbitMQ。
  #    连接是惰性的：没有 listener 就不会去连，所以不配也不会有后台重连日志。
  #
  # ⚠️ 真要用 MQ 时（补了 publisher / listener），把这两个默认值删掉改回必填，
  #    并在 docker-compose.yml 里补 rabbitmq 服务 —— 那时「连不上就起不来」是对的。
  username: ${RABBITMQ_USERNAME:}
  password: ${RABBITMQ_PASSWORD:}
  listener:
    simple:
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 3

