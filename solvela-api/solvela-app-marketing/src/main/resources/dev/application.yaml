#############################################################################################################
#                                                                                                           #
# 本文件是 solvela-app-marketing（营销服务）的独有配置。                                                        #
# 通用配置在 solvela-base-core 的 solvela-base.yaml 里（数据库、Redis、文件…），此处同名项会覆盖它。              #
#                                                                                                           #
# 本服务装的是：活动、抽奖、任务、彩票、商城、奖品、发奖派发、脚本引擎。                                          #
#                                                                                                           #
# 与 admin / app / member 连的是【同一个库、同一个 Redis】—— 第一步只拆进程，不拆数据。                          #
# 所以凡是「全局只该有一个执行者」的东西都不能在这里开，见下面的定时任务说明。                                    #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-app-marketing
  log-directory: ${localPath:/home}/logs/solvela/${project.name}/${spring.profiles.active}

# 端口按服务顺排：admin 1024 / app 1025 / marketing 1026 / member 1027。
# 别改成随手一个号 —— 网关的转发规则、运维的防火墙白名单都是照着这几个号写的。
server:
  port: 1026
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# 本服务【不开】定时任务。
# 四个进程连同一个库，@Scheduled 每多开一个进程就多跑一遍 ——
# 发奖、结算重复执行，而多发的那一份没人会主动来报。
# 定时任务归 solvela-admin 独占。
# -------------------------------------------------------------------------

# 环境
spring:
  profiles:
    active: '@profiles.active@'

# ---------------------------------------------------------------------------
# RabbitMQ：发奖的异步回写走它（会员服务发、营销服务收）
# ---------------------------------------------------------------------------
spring.rabbitmq:
  host: 127.0.0.1
  port: 5672
  username: admin
  password: 123456
  listener:
    simple:
      # 消费失败不重新入队，直接进死信 —— 重入队会让一条必然失败的消息把队列打爆，
      # 而死信队列至少留下了证据、能被人工重投
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 3
