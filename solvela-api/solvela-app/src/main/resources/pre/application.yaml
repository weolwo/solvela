#############################################################################################################
#                                                                                                           #
# 本文件是 solvela-app 的独有配置，通用配置在 solvela-base 的 solvela-base.yaml 里（数据库、Redis、sa-token、文件…）。   #
# 此处的配置会覆盖 solvela-base.yaml 中的同名项，合并逻辑见类：YamlProcessor.java                                   #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-app
  log-directory: /home/logs/solvela/${project.name}/${spring.profiles.active}

# 项目端口和url根路径
server:
  port: 1025
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# actuator 的独立端口（业务端口 + 1000）
#
# 🔴 必须独立端口，不能挂在业务端口上。两个原因：
#    ① /actuator/** 是网关安全闸的【蜜罐路径】之一（见 t_config 的
#       gateway_security_gate.honeypotPaths）。挂在业务端口上时，Prometheus
#       每抓一次就被当成扫描器，罚 IP 与设备 24 小时 —— 而响应和 404 一模一样，
#       两边都不报错，只是过一会儿发现自己被封了。
#    ② 独立端口让 Boot 建一个【独立的 management 子上下文和 servlet 容器】，
#       父上下文里那些 @Component 的 Filter（安检门、限流、设备令牌）都不会
#       注册进去，所以抓取既过不了安检门、也不计入限流。
#
# ⚠️ 这个端口【不对外发布】：docker-compose.yml 没有它的 ports，
#    deploy/k8s 里也没有 NodePort，nginx 没有任何到它的 proxy_pass。
#    只给同机 / 同集群的 Prometheus 用。
# -------------------------------------------------------------------------
management:
  server:
    port: 2025
  endpoints:
    web:
      exposure:
        # 只开这两个。env / heapdump / loggers / threaddump 一律不开 ——
        # 它们能读出配置里的密钥、能导出整个堆。
        include: health,prometheus
  metrics:
    distribution:
      # 🔴 不开这一行就没有 http_server_requests_seconds_bucket ——
      #    micrometer 默认只发 count / sum / max 三个，histogram_quantile 算不出
      #    P99，面板是空的，而 Prometheus 那边 target 一直显示 up。
      #    这种"抓得到、但算不出"的缺口最难发现，所以显式写上。
      #
      # ⚠️ 代价是时间线数量：每个 uri × status 会多出一排桶。Spring 对 uri 标签
      #    做了模板化（/activity/{activityCode}/draw 而不是具体值），所以不会被
      #    路径参数炸开；真要再省就加 management.metrics.distribution.slo 只留几档。
      percentiles-histogram:
        http.server.requests: true
  # ⚠️ 这里刻意【不设】 management.metrics.tags.application。
  #    父 pom 对 src/main/resources/${profiles.active}/*.yaml 开了 filtering=true，
  #    而本项目没有继承 spring-boot-starter-parent（只 import 了 BOM），所以 Maven
  #    的默认分隔符 ${...} 也生效 —— 写 ${project.name} 会在【构建期】被替换成
  #    【这个文件所在模块】的名字，而不是运行它的进程名。实测 admin 与 app-biz
  #    都会被标成 application="solvela-base-core"，而且不报任何错。
  #    （${project.log-directory} 能活到运行期，只是因为 Maven 里没有这个属性。）
  #    要区分进程用 Prometheus 抓取配置里写死的 app 标签，见
  #    deploy/k8s/monitoring/40-prometheus.yaml 的 solvela-backend job。

# -------------------------------------------------------------------------
# 这里原先有一段 solvela.job（role: NONE），用来阻止本进程执行定时任务。
# 2026-08-25 job 模块整体移交 solvela-admin 之后已经删除 —— 本服务的 classpath 上
# 根本没有调度器、执行池和任何 SolvelaJob 实现类，不存在"会不会跑"的问题了。
# 从"靠配置约束"变成"物理上不具备"，这才是想要的形态。
#
# ⚠️ solvela-base 只保留了 jobspi（SolvelaJob 接口 / @SolvelaJobHandler 等 6 个 SPI 类），
#    是给业务模块实现任务用的，本身不含任何执行逻辑。
# -------------------------------------------------------------------------
# 环境
spring:
  profiles:
    active: '@profiles.active@'

  # ---------------------------------------------------------------------------
  # Redis。2026-09-01 从 solvela-base-core 的 solvela-base.yaml 搬过来 ——
  # 网关不再依赖任何 base 模块，那份共享配置也就不再自动生效。
  #
  # 顺带说明搬过来的只有这一段：那份共享配置还给网关配了一个【它连驱动都没有的
  # MySQL 数据源】和一套【它从不发信的 SMTP】。网关真正用到的只有下面这几行。
  #
  # 两个用途：会话存储（MemberRedisTokenStore，StringRedisTemplate）
  #          与身份缓存（AppCacheConfig 的 RedisCacheManager）。
  #
  # ⚠️ 没有密码就【不要】留空的 password 键 —— 空串会被当成"有密码"而发 AUTH，
  #    对无密码的 Redis 直接报 ERR Client sent AUTH, but no password is set。
  # ---------------------------------------------------------------------------
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 5
          min-idle: 1
          max-idle: 3
          max-wait: 30000ms

# ---------------------------------------------------------------------------
# C 端认证
# ---------------------------------------------------------------------------
solvela:
  app:
    rate-limit:
      # 网关限流（docs/架构/网关阶梯限流-技术方案.md）。阈值、阶梯不在这里 —— 它们在库里、经 Redis 快照下发、后台可改。
      # 总开关：关掉等于网关不限流，只用于误伤排障时的临时回退
      enabled: true
      # 🔴 账号维度计数键的 HMAC 密钥：匿名接口的「账号」是邮箱 / 手机号，不能明文当 Redis 键，
      #    裸 SHA-256 也不行（手机号能被穷举还原）。不配或短于 32 位启动即失败。
      #    可以随时换：换了只是账号维度的计数从零开始。同一环境的多个网关实例必须一致。
      #    生产从环境变量注入：${SOLVELA_APP_RATE_LIMIT_ACCOUNT_KEY}
      account-key: "2MT5fJyyAOoYoTUPbuYGE6VNa7XElVqsIWFclHo4"
    auth:
      # 只剩「令牌怎么携带」这两件属于端的事。
      header: Authorization
      scheme: Bearer
    device:
      # 携带设备令牌的请求头。改它要与客户端同批次发布 —— 换了头名，
      # 老客户端带的那个头服务端就不看了，等于全体退回「没有设备身份」
      header: X-Device-Token
      # 🔴 灰度档：off | observe | enforce
      #
      # 服务端和客户端不可能同时上线，直接强制会让所有存量客户端【当场 401】——
      # 这是整个设备身份方案里唯一可能造成全站事故的地方。所以三段走：
      #   off      放行，什么都不记（服务端先上，客户端还没发版）
      #   observe  放行 + 周期性打「带令牌的请求占比」，那个比例就是客户端版本覆盖率
      #   enforce  没有有效设备令牌一律 401（@DeviceExempt 标注的除外）
      #
      # ⚠️ 切 enforce 之前先确认【回退路径是通的】：改回 observe 要能在几分钟内生效，
      #    而不是等下一次发版。
      # 🔴 引号不能去：YAML 1.1 把 off/on/yes/no 解析成【布尔】，不是字符串。
      #    三个档位里只有 off 撞上这条规则 —— 默认档恰好是唯一有歧义的那个。
      #
      # 2026-09-10 由 off 拨到 observe：客户端已经开始带设备令牌了。
      # observe 与 off 对请求的处理【完全一样】—— 都是放行，一个都不拦；
      # 唯一的差别是它会周期性打一行覆盖率日志（搜【Device】设备令牌覆盖率）。
      # 而那个比例是决定「能不能切 enforce」「要不要花钱买厂商指纹」的唯一依据，
      # 停在 off 就等于把整套方案的产出关着。
      mode: observe
    cookie:
      # Web 端凭证的 HttpOnly cookie 与跨站写请求防护（见 WebCookieProperties）。
      # 🔴 secure 与 __Host- 前缀绑定：只有 HTTPS 下浏览器才会保存 Secure cookie。
      #    某个环境走的是 http 而这里配了 true，表现是「登录成功、刷新就掉线」，服务端日志一切正常
      secure: true
      # 浏览器发起的跨源写请求一律 403（含登录、注册 —— 防登录 CSRF）。App / Postman 不带那两个头，不受影响
      cross-origin-guard: enforce
      # 「自己的源」由 X-Forwarded-Proto + Host 算出（nginx 原样透传），不需要额外配置
    captcha:
      # 自建滑块验证码（CaptchaService）。上线即拦截；每个场景单独开关，误伤时只关那一处
      #   send-code       发邮箱 / 短信验证码之前（这两个接口天生匿名，又是轰炸的原料）
      #   password-login  密码登录之前（撞库主战场）。邮箱验证码登录不拦：发码那一步已经过过一次
      # ⚠️ 自建滑块只能抬高批量成本，挡不住专门针对它写的破解。对抗专业黑产要换厂商
      send-code: true
      password-login: true
      tolerance: 5
      # 校验拖动轨迹（TrackChecker）：拦直接提交 x、瞬移、匀速直线的脚本。误伤时只关这一项
      track-check: true
    step-up:
      # 🔴 敏感操作二次验证的灰度档：off | observe | enforce（见 StepUpProperties）
      #
      # 不受信任的设备（该会员在这台设备上的首次登录不满 7 天、且没验证过）
      # 调 @StepUpRequired 接口（新增/修改收货地址、充话费）时：
      #   off      什么都不做
      #   observe  照常判断、放行，把「本来会拦的」打成 WARN（搜【二次验证】命中但放行）
      #   enforce  返回 403 STEP_UP_REQUIRED，客户端弹邮箱验证码、验证后重试
      #
      # ⚠️ 切 enforce 前客户端必须已经会处理 STEP_UP_REQUIRED，否则新设备上加不了地址且没有出路。
      # 引号理由同上面的 device.mode：YAML 1.1 会把裸 off 解析成布尔。
      #
      # 2026-09-26 上线即 observe：先看新设备用户里有多少人会被打扰，再决定门槛与是否 enforce。
      mode: observe
  auth:
    device:
      # -----------------------------------------------------------------
      # 🔴 设备令牌的签名密钥（DeviceTokenCodec）
      # -----------------------------------------------------------------
      # 设备令牌是【自包含】的：不进 Redis，每个请求靠一次 HMAC 验签。
      # 所以这把密钥就是唯一的信任根 —— 它泄露 = 任何人都能自签一个合法设备号，
      # 而伪造出来的令牌和真的一模一样，日志里看不出来，设备维度的限流全部失效。
      #
      # 🔴 【不要】复用 solvela.crypto.pii.hmac-key：那把【永远不能改】
      #    （改了老会员登不进来，见 PiiHasher 类注释），而这把【必须能换】。
      #    一个不能改、一个必须能换，共用一把等于两边都做不到。
      #
      # 轮换是三步，顺序不能反（见 DeviceTokenProperties 类注释）：
      #   ① 加新密钥进 keys，不动 key-version —— 此时新密钥只被接受、不被使用
      #   ② 确认所有实例都加载到新配置，再把 key-version 指向它
      #   ③ 等旧令牌自然消亡（重装/清缓存）后才能删旧的。这一步【没有时间表】——
      #      设备令牌不过期，删早了就是让那批用户重新注册设备
      #
      # 🔴 生产环境从环境变量注入：
      #        keys:
      #          1: ${SOLVELA_AUTH_DEVICE_KEY_V1}
      # ⚠️ 不配的话应用启动即失败（DeviceTokenCodec 构造器直接抛），理由同 PII 密钥：
      #    给了默认值，忘配置的人会用一个全世界都知道的密钥签令牌，功能完全正常，
      #    而「设备号不可伪造」这个整套设计赖以成立的前提直接归零，且没有任何迹象。
      #
      # ⚠️ 网关与 app-biz 是两个进程，但验的是【同一批令牌】——
      #    同环境两边的 keys 必须逐字一致，否则一边签的另一边验不过。
      key-version: 1
      keys:
        1: "Pr4mNbW8yZjT6xKfL2dVcH5pEaR9uG3oI7tXqM1s"
  member:
    session:
      # 令牌有效期与并发会话数已于 2026-08-30 从 solvela.app.auth 搬到这里 ——
      # 它们是【会员的规则】不是端的细节，而后台冻结会员时要吊销他的全部会话，
      # 会话存储必须在会员域里够得着（见 MemberSessionProperties 的类注释）。
      #
      # C 端的取舍与后台相反：用户不接受频繁登录，所以 TTL 给得长，
      # 靠「可即时吊销」兜安全 —— 而那个前提到 2026-08-30 才真正成立。
      # 改这个值只影响【新签发】的令牌，已有令牌的 TTL 不会跟着变。
      token-ttl: 30d
      # 单个会员最多同时有效的令牌数，超出时挤掉最旧的。
      # 不限制意味着一个被盗号的账号可以攒出无限会话，revokeAll 的成本也随之无上限。
      max-sessions: 10

# ---------------------------------------------------------------------------
# 下游服务地址。
#
# ⚠️ 2026-08-31 起 member 与 marketing 是【同一个进程】（solvela-app-biz:1026）——
# app-member(1027) 已撤销。两个键刻意都留着、都指向 1026：
# 网关的业务代码认的是 MemberAuthApi / ActivityApi 两个契约，
# 将来资产域真拆出去时只改这里的一个 URL，代码一行不动。
# 合成一个键反而是把「它们是两个逻辑服务」这件事抹掉了。
# ---------------------------------------------------------------------------
solvela.client:
  member.base-url: ${MEMBER_SERVICE_URL:http://127.0.0.1:1026}
  marketing.base-url: ${MARKETING_SERVICE_URL:http://127.0.0.1:1026}

# ---------------------------------------------------------------------------
# 接口文档。同上，从 solvela-base.yaml 搬来 —— pre 环境关。
# 生产包还会在 pom 的 prod profile 里把整套文档依赖排出 BOOT-INF/lib，这里是第二道。
# ---------------------------------------------------------------------------
springdoc:
  swagger-ui:
    enabled: false
    doc-expansion: none
    tags-sorter: alpha
  api-docs:
    enabled: false

knife4j:
  enable: false
  basic:
    enable: false
