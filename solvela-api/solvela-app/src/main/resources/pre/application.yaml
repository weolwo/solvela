#############################################################################################################
#                                                                                                           #
# 本文件是 solvela-app 的独有配置，通用配置在 solvela-base 的 solvela-base.yaml 里（数据库、Redis、sa-token、文件…）。   #
# 此处的配置会覆盖 solvela-base.yaml 中的同名项，合并逻辑见类：YamlProcessor.java                                   #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-app
  log-directory: /home/logs/solvela/${project.name}/${spring.profiles.active}

# 项目端口和url根路径
server:
  port: 1025
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# 这里原先有一段 solvela.job（role: NONE），用来阻止本进程执行定时任务。
# 2026-08-25 job 模块整体移交 solvela-admin 之后已经删除 —— 本服务的 classpath 上
# 根本没有调度器、执行池和任何 SolvelaJob 实现类，不存在"会不会跑"的问题了。
# 从"靠配置约束"变成"物理上不具备"，这才是想要的形态。
#
# ⚠️ solvela-base 只保留了 jobspi（SolvelaJob 接口 / @SolvelaJobHandler 等 6 个 SPI 类），
#    是给业务模块实现任务用的，本身不含任何执行逻辑。
# -------------------------------------------------------------------------
# 环境
spring:
  profiles:
    active: '@profiles.active@'

# ---------------------------------------------------------------------------
# C 端认证
# ---------------------------------------------------------------------------
solvela:
  app:
    auth:
      # 只剩「令牌怎么携带」这两件属于端的事。
      header: Authorization
      scheme: Bearer
  member:
    session:
      # 令牌有效期与并发会话数已于 2026-08-30 从 solvela.app.auth 搬到这里 ——
      # 它们是【会员的规则】不是端的细节，而后台冻结会员时要吊销他的全部会话，
      # 会话存储必须在会员域里够得着（见 MemberSessionProperties 的类注释）。
      #
      # C 端的取舍与后台相反：用户不接受频繁登录，所以 TTL 给得长，
      # 靠「可即时吊销」兜安全 —— 而那个前提到 2026-08-30 才真正成立。
      # 改这个值只影响【新签发】的令牌，已有令牌的 TTL 不会跟着变。
      token-ttl: 30d
      # 单个会员最多同时有效的令牌数，超出时挤掉最旧的。
      # 不限制意味着一个被盗号的账号可以攒出无限会话，revokeAll 的成本也随之无上限。
      max-sessions: 10

# ---------------------------------------------------------------------------
# 下游服务地址。走环境变量：容器编排里服务名与端口不该写死在包里
# ---------------------------------------------------------------------------
solvela.client:
  member.base-url: ${MEMBER_SERVICE_URL:http://127.0.0.1:1027}
  marketing.base-url: ${MARKETING_SERVICE_URL:http://127.0.0.1:1026}
