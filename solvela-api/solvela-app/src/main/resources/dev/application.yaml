#############################################################################################################
#                                                                                                           #
# 本文件是 solvela-app 的独有配置，通用配置在 solvela-base 的 solvela-base.yaml 里（数据库、Redis、sa-token、文件…）。   #
# 此处的配置会覆盖 solvela-base.yaml 中的同名项，合并逻辑见类：YamlProcessor.java                                   #
#                                                                                                           #
# ⚠️ 本服务与 solvela-admin 连的是【同一个库、同一个 Redis】，只是端口和进程不同。                                 #
#    所以凡是「全局只该有一个执行者」的东西，都必须在这里显式关掉 —— 见下面的 solvela.job。                      #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-app
  log-directory: ${localPath:/home}/logs/solvela/${project.name}/${spring.profiles.active}

# 项目端口和url根路径
# 🔴 1025 是刻意挨着 solvela-admin 的 1024 排的，别改成随手一个端口 ——
#    前端 .env、网关转发规则、运维的防火墙白名单都是照着这两个号写的。
server:
  port: 1025
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# 这里原先有一段 solvela.job（role: NONE），用来阻止本进程执行定时任务。
# 2026-08-25 job 模块整体移交 solvela-admin 之后已经删除 —— 本服务的 classpath 上
# 根本没有调度器、执行池和任何 SolvelaJob 实现类，不存在"会不会跑"的问题了。
# 从"靠配置约束"变成"物理上不具备"，这才是想要的形态。
#
# ⚠️ solvela-base 只保留了 jobspi（SolvelaJob 接口 / @SolvelaJobHandler 等 6 个 SPI 类），
#    是给业务模块实现任务用的，本身不含任何执行逻辑。
# -------------------------------------------------------------------------
# 环境
spring:
  profiles:
    active: '@profiles.active@'

# ---------------------------------------------------------------------------
# C 端认证
# ---------------------------------------------------------------------------
solvela:
  app:
    auth:
      # 令牌有效期。C 端的取舍与后台相反：用户不接受频繁登录，所以给得长，
      # 靠「可即时吊销」兜安全，而不是靠短有效期。
      # 改这个值只影响<b>新签发</b>的令牌，已有的令牌 TTL 不会跟着变。
      token-ttl: 30d
      header: Authorization
      scheme: Bearer
      # 单个会员最多同时有效的令牌数，超出时挤掉最旧的。
      # 不限制意味着一个被盗号的账号可以攒出无限会话，revokeAll 的成本也随之无上限。
      max-sessions: 10
