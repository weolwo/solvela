spring:
  # 数据库连接信息
  datasource:
    url: jdbc:p6spy:mysql://127.0.0.1:3306/solvela?autoReconnect=true&useServerPreparedStmts=false&rewriteBatchedStatements=true&characterEncoding=UTF-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowLoadLocalInfile=true
    username: root
    password: root
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    initial-size: 2
    min-idle: 2
    max-active: 10
    max-wait: 60000
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000
    filters: stat

  # redis 连接池配置信息
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      # ⚠️ 这里原本有一行空的 `password:`。Redisson 3 会把空串当成"没有密码"，
      #    Redisson 4 不再做这个宽容处理，照样发 AUTH，对无密码的 Redis 直接报
      #    `ERR Client sent AUTH, but no password is set` 而启动失败。
      #    没有密码就不要留这个键；有密码时正常填即可。
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 5
          min-idle: 1
          max-idle: 3
          max-wait: 30000ms

  # 邮件，置以SSL的方式发送, 这个需要使用这种方式并且端口是465
  mail:
    host: smtp.163.com
    port: 465
    username: lab1024@163.com
    password: LAB1024LAB
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            # 465 端口是「连上去就是 SSL」，enable: true 就够了，用 JDK 默认的
            # SSLSocketFactory。163 / QQ / Gmail 的证书都是正常签发的，不需要自定义工厂。
            #
            # 🔴 2026-09-09 删掉了这两行：
            #        socketFactory.class: com.sun.mail.util.MailSSLSocketFactory
            #        socketFactory.fallback: false
            #    那个类【在 classpath 上不存在】—— 本项目用的是 Angus Mail 2.0.5
            #    （Jakarta Mail 的实现），类在 org.eclipse.angus.mail.util 下。
            #    而 fallback: false 意味着它不会退回默认工厂，于是发信直接失败。
            #
            #    为什么一直没人发现：test-connection: false 让它启动时不连 SMTP，
            #    而全仓至今没有真正发出去过一封信（管理端的双因子登录默认没开）。
            #    改成 Angus 的类名也能跑，但那等于把类名跟邮件实现绑死 ——
            #    换实现或升版本时又会以同样的方式坏掉，而且同样只在发信那一刻才暴露。
            enable: true
        debug: false

  # json序列化相关配置
  jackson:
    # ⚠️ Jackson 3 把枚举/日期相关的开关从 Serialization/DeserializationFeature 拆到了
    #    EnumFeature 与 DateTimeFeature，Spring Boot 4 对应挪到 spring.jackson.datatype.* 下。
    #    还留在老位置会在启动时直接绑定失败（No enum constant ...），不是运行期才暴露。
    datatype:
      enum:
        write-enums-using-to-string: true
        read-enums-using-to-string: true
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: always
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 上传文件和请求大小
  servlet:
    multipart:
      max-file-size: 20MB # 单个文件的最大大小
      max-request-size: 10MB # 整个请求的最大大小

  # 缓存实现类型
  cache:
    type: redis

# 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

# tomcat 配置，主要用于 配置 访问日志（便于将来排查错误）
server:
  tomcat:
    basedir: ${project.log-directory}/tomcat-logs
    accesslog:
      enabled: true
      max-days: 7
      pattern: "%t %{X-Forwarded-For}i %a %r %s (%D ms) %I (%B byte)"

  # 响应压缩。收益集中在管理端：/login、/login/getLoginInfo、/menu/query 这三个
  # 平均 43~48KB（菜单与权限树），实测 gzip 后剩 ~18%，一次登录 ~138KB 降到 ~25KB。
  # C 端响应绝大多数在 512B 以下，够不到阈值，基本不受影响。
  #
  # ⚠️ 刻意不写 mime-types：Boot 默认列表已含 application/json，且【不】含
  #    application/octet-stream、图片和 xlsx —— 代码生成器下载、文件下载、
  #    Excel 导出（xlsx 本身就是 zip）因此天然被排除，压了也白压。
  #    要加类型用 additional-mime-types 追加，别覆盖 mime-types 把这个安全默认冲掉。
  #
  # ⚠️ 开启后上面 accesslog 的 %B 记的是【压缩后】字节数，与历史日志不能直接比。
  compression:
    enabled: true
    # 与 Boot 默认值一致。1~2KB 这一档只占总响应字节的约 2%，
    # 而压缩会让响应丢掉 Content-Length 转成 chunked，为这 2% 不值当。
    min-response-size: 2KB

# 文件上传 配置
file:
  storage:
    # local = 存本机磁盘；cloud = 存 S3 协议的对象存储（本地就是 docker compose 里那个 MinIO）。
    # 默认 local：不是所有人都会把 MinIO 起起来，而起不来时 cloud 模式是【启动即失败】。
    # 要用 MinIO：docker compose up -d minio，然后 .env 里写 FILE_STORAGE_MODE=cloud。
    mode: ${FILE_STORAGE_MODE:local}
    # 公开文件的 URL 前缀。C 端用户是匿名的、永远带不上 token，活动展示图就靠它。
    # 不配则一律退回要登录态的下载接口 —— 管理端仍然能看图（带 token 取字节），但 C 端会全是叉。
    # 本地模式指向 /support/file/public/：它只放行 public_flag=1 的分类，其余一律 404
    # （2026-09-05 补上；此前这句注释描述的 visibility 判断并不存在，见「文件分类-公开标记.sql」）。
    # 上了对象存储/CDN 之后，换成 CDN 域名 + 同一个 storageKey 即可，业务代码与前端都不用动。
    public-url-prefix: http://127.0.0.1:1024/support/file/public/
    local:
      upload-path: /home/solvela/upload/   #文件上传目录
      url-prefix:
    cloud:
      # 默认值对着 docker compose 里的 MinIO。换阿里云 OSS / AWS S3 只改这几个值，
      # 业务代码与前端都不动 —— 上面那个 public-url-prefix 也不用动，理由见 path-style 那段。
      region: ${FILE_STORAGE_CLOUD_REGION:us-east-1}
      endpoint: ${FILE_STORAGE_CLOUD_ENDPOINT:http://127.0.0.1:9000}
      bucket-name: ${MINIO_BUCKET:solvela}
      access-key: ${MINIO_ROOT_USER:}
      secret-key: ${MINIO_ROOT_PASSWORD:}
      private-url-expire-seconds: 3600
      # 🔴 MinIO 必须开【路径寻址】：bucket 放 URL 路径里（endpoint/bucket/key），
      #    而不是塞进主机名（bucket.endpoint/key）。
      #    配错时的表现不像存储问题 —— 它会去解析 solvela.127.0.0.1:9000，
      #    报出来的是 UnknownHostException，看着像网络坏了。
      #    上真的 OSS/S3 时置 false（它们用的是虚拟主机寻址）。
      path-style-access: ${FILE_STORAGE_CLOUD_PATH_STYLE_ACCESS:true}

# open api配置
springdoc:
  swagger-ui:
    enabled: true # 开关
    doc-expansion: none  #关闭展开
    tags-sorter: alpha
    server-base-url:
  api-docs:
    enabled: true # 开关
knife4j:
  enable: true
  basic:
    enable: false
    username: api # Basic认证用户名
    password: 1024 # Basic认证密码

# 跨域配置
access-control-allow-origin: '*'



solvela:
  # -----------------------------------------------------------------------
  # 管理端认证
  # 取代原先的 sa-token 配置。那一段有十一个开关，真正影响本系统行为的只有下面这三条；
  # 其余（token-style / auto-renew / is-log / is-print / is-read-cookie…）要么是框架
  # 内部实现细节，要么本项目根本没用到 —— 它们的存在只会让人以为「这里可以调」。
  #
  # 「最低活跃频率」不在这里：它是三级等保配置，存在 t_config 表里、由后台界面维护，
  # 改完要立刻生效（见 Level3ProtectConfigService）。放进 yaml 等于要重启才能改。
  # -----------------------------------------------------------------------
  admin:
    auth:
      # 令牌绝对有效期。后台与 C 端的取舍相反：这里给得短，
      # 因为一个后台账号能改配置、能发奖、能看会员手机号。
      # 改这个值只影响新签发的令牌，已有令牌的 TTL 不会跟着变。
      token-ttl: 30d
      # 🔴 【不用 Authorization】：管理端上线时前面加了一层 nginx Basic Auth
      #    作为网络级闸门（deploy/nginx），Basic Auth 占的就是 Authorization 头。
      #    若 app token 也放 Authorization：登录后 admin-web 每个请求带上 token 时，
      #    要么覆盖掉浏览器的 Basic 凭据（nginx 回 401、反复弹认证框），要么
      #    nginx 把 Basic 的 Authorization 透传给后端、后端拿它当 token（判定未登录）。
      #    2026-09-12 上线实测两头都踩到。换个自己的头就两不相干。
      #    ⚠️ 改这里必须同步 admin-web 的 TOKEN_HEADER（src/lib/axios.js）。
      header: X-Access-Token
      scheme: Bearer
      # true = 新登录挤掉该账号的旧会话（对应原 sa-token 的 is-concurrent: false）。
      # 一个后台账号同时在多处登录，多半意味着账号被共用或被盗，
      # 而「被挤下线」是使用者能立刻察觉的信号。
      single-session: true

  # -------------------------------------------------------------------------
  # 会员号发号
  # -------------------------------------------------------------------------
  member:
    code:
      # 🔴 验证码怎么送到用户手上：REAL（真发出去） / LOG（不发，打进日志）
      #
      # dev / test 两条通道都用 LOG：省掉配 SMTP、也不用等短信厂商报备，
      # 验证码直接在日志里 —— 搜【邮箱验证码-LOG】或【短信验证码-LOG】。
      #
      # 🔴 生产【不许】用 LOG，配了会启动失败。日志里躺着每个人的验证码，
      #    看得到日志的人就能接管任意账号 —— 而日志的访问面通常比数据库宽得多。
      email-transport: LOG
      sms-transport: LOG
    register:
      # 手机号注册是否必须验短信验证码。默认 true。
      #
      # dev / test 保持 true：配合上面的 sms-transport: LOG，不需要任何厂商，
      # 码打进日志就能把整条链路跑通 —— 也就顺带保证了它不会悄悄退化。
      phone-code-required: true
    device:
      guard:
        # 🔴 只观察不拦截。下面四个阈值全是【拍出来的】，没有任何真实分布支撑。
        # 直接开拦截，最可能的结果不是拦住刷子，是拦住一整栋写字楼里共用出口的
        # 正常用户 —— 而他们不会来报障，只会不再打开。
        #
        # 先跑 dry-run：命中什么都照常放行，只往日志里记一条「本来会被拦」
        # （搜 【设备闸门】）。拿真实流量把这四个数校准完再关掉它。
        #
        # ⚠️ 关掉之前还差一样东西：验证码。方案里这几条的处置是「降级为需要验证码」，
        #    而验证码还没接 —— 现在关掉就只能硬拒绝，那是误伤代价最大的一种做法，
        #    也会给攻击者一个精确的调试反馈。
        dry-run: true
        # 一台设备一天登录几次（含失败）
        max-login-per-day: 30
        # 一台设备一小时失败几次。窗口比其它几项短：连续失败是撞库的即时信号
        max-fail-per-hour: 10
        # 一台设备一天碰几个【不同的】会员号。四条里信号最强的一条 ——
        # 一机多号是养号的必然特征。正因为强，误伤也最刺眼，所以给 3 不是 1
        max-members-per-day: 3
        # 一台设备一天建几个号。压批量建号，比 IP 那一维硬得多
        max-register-per-day: 2
    id:
      # 🔴 置换密钥：决定「内部序号 -> 10位会员号」的映射。
      #    <b>上线后永远不能改</b> —— 改了等于换一套映射，新号可能撞上已发出去的老号。
      #    生产环境应从配置中心/环境变量注入，不要跟着代码库走：
      #      secret-key: ${SOLVELA_MEMBER_ID_SECRET_KEY}
      #    下面这个是本 profile 的独立随机串，四个环境刻意不同 ——
      #    环境之间号段重合是正常的，但映射不同可以避免测试号被误认成生产号。
      secret-key: "5gL0PLFY9akyIhmL3MFDxXvyer1hiJAxRkomd37C"
      # 号段大小：一次向 t_member_id_seq 批发多少个内部序号。
      # 库里 t_member_id_seq.step 的值优先于这里，方便运维临时调整而不用发版。
      step: 1000

  # -------------------------------------------------------------------------
  # 个人信息（PII）字段级加密：收件人姓名/电话/详细地址落库前加密
  # -------------------------------------------------------------------------
  crypto:
    pii:
      # 🔴 <b>用于加密之后就不能再改</b> —— 改了旧数据全部解不开（AES-GCM 会认证失败并抛异常，
      #    不会静默解出乱码，这是好事）。真要轮换密钥，得先用旧密钥把存量行读出、新密钥写回，
      #    密文的 P1: 前缀就是分辨轮换进度的依据。
      # 🔴 生产环境改为环境变量注入，<b>不要和数据库备份放在同一个地方</b> ——
      #    密钥和密文躺在一起等于没加密：
      #      secret-key: ${SOLVELA_CRYPTO_PII_SECRET_KEY}
      # ⚠️ 不配的话应用<b>启动即失败</b>（PiiCipher 的构造器直接抛），
      #    刻意不给默认密钥：给了就会有人忘了配，然后用一个全世界都知道的密钥把用户地址加密进库。
      #    四个环境的串刻意不同：拿测试库的备份不该能解开生产的数据。
      secret-key: "Qk3rZbT8yWv6HsLp2NdXeA9uCmJf5gRtY7iBoV1x"

      # -----------------------------------------------------------------
      # 🔴 摘要密钥（PiiHasher）：与上面的加密密钥刻意分开
      # -----------------------------------------------------------------
      # 两把钥匙用途不同，泄露后果也不同：secret-key 泄露 = 密文能被解开；
      # hmac-key 泄露 = 手机号能被离线穷举反查（号码全集只有 10^8 量级）。
      # 共用一把的话，一处泄露两种防护同时失效，将来也没法只轮换其中一个。
      #
      # 🔴 <b>比 secret-key 更改不得</b>：secret-key 尚能「旧钥解、新钥写」迁移，
      #    hash 不可逆，改了之后老会员按新摘要查不到、登不进来，而唯一索引又拦不住他
      #    用同一个手机号重新注册 —— 一个号变两个账号。详见 PiiHasher 类注释。
      #
      # 🔴 生产环境从环境变量注入，且不要和数据库备份放在一起：
      #    密钥和摘要躺在一起，HMAC 就退化成了纯哈希，等于没加。
      #      hmac-key: ${SOLVELA_CRYPTO_PII_HMAC_KEY}
      # ⚠️ 不配的话应用启动即失败（PiiHasher 构造器直接抛），理由同 secret-key。
      hmac-key: "Hn4tWqL9zXbE2vRcM7yKdA5sJfP1gUoT6iNmB3wZ"

  # -------------------------------------------------------------------
  # 🔴 设备令牌的签名密钥（DeviceTokenCodec）
  # -------------------------------------------------------------------
  # 本块服务【管理端】与【app-biz】两个进程 —— 它们都扫到 solvela.auth，
  # 而 DeviceTokenCodec 不配密钥就【启动即失败】（构造器直接抛，理由同上面的 PII 密钥）。
  #
  # ⚠️ 网关（solvela-app）吃不到本文件 —— 它 2026-09-01 摘掉了全部 base 模块。
  #    它那份在 solvela-app/src/main/resources/*/application.yaml 里，
  #    【同环境两处必须逐字一致】：三个进程验的是同一批令牌，
  #    不一致的表现是「网关签的令牌到了下游验不过」，而两边日志都不会报错。
  #
  # 🔴 【不要】复用上面的 pii.hmac-key：那把【永远不能改】（改了老会员登不进来），
  #    这把【必须能换】（泄露 = 任何人都能自签一个合法设备号）。
  #    一个不能改、一个必须能换，共用一把等于两边都做不到。
  #
  # 轮换三步，顺序不能反（见 DeviceTokenProperties 类注释）：
  #   ① 加新密钥进 keys，不动 key-version —— 新密钥只被接受、不被使用
  #   ② 确认所有实例都加载到新配置，再把 key-version 指向它
  #   ③ 等旧令牌自然消亡后才能删旧的。这一步【没有时间表】——
  #      设备令牌不过期，删早了就是让那批用户重新注册设备
  #
  # 🔴 生产环境从环境变量注入：
  #        keys:
  #          1: ${SOLVELA_AUTH_DEVICE_KEY_V1}
  auth:
    device:
      key-version: 1
      keys:
        1: "Dv1qKmXt7RbN4wZfL9pYcJ3hEaS6uG2oI5tWrM8y"

# 动态脚本引擎
script:
  # 底层引擎实现，目前仅 qlexpress
  engine: qlexpress
  # 单次脚本执行超时(ms)。注意这是「假超时」：只能中断脚本自身的指令循环，
  # 无法中断已进入 Java 函数的 HTTP/DB 调用，耗时操作必须在 Java 侧自己控超时。
  timeout-millis: 3000
  # 小数运算是否走 BigDecimal。涉及金额与积分，保持开启。
  precise: true
  # 是否允许脚本反射调用任意 Java 成员。打开等于把 RCE 面暴露给脚本内容，
  # 任何环境都不要改成 true。系统能力一律通过 @ScriptFunction 白名单暴露。
  allow-java-reflect: false
  # 慢脚本日志阈值(ms)
  slow-log-millis: 200

# 彩票中台
lottery:
  fpe:
    # FPE 发号主密钥。派生规则：key = HMAC-SHA256(master-secret, lotteryCode + "|" + issueNo)
    #
    # ⚠️⚠️ 一旦有任何期号发过号，本值就不可再变更 ⚠️⚠️
    # 号码是「连续游标经 FPE 加密」得来的，密钥变了等于换了一套加密映射：
    #   · 已发出的号码再也反解不回游标，客服验真、对账自证清白全部失效；
    #   · 新发的号码可能与历史号码重复，而 uk_issue_ticket 只会让用户领号直接报错。
    # 换密钥的唯一安全时机是「该彩票编码下一期号码都还没发过」。
    #
    # 生产环境请改为环境变量注入，不要把真实密钥提交进仓库：
    #   master-secret: ${LOTTERY_FPE_MASTER_SECRET}
    master-secret: dev-lottery-fpe-master-secret-2026

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
