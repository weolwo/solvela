#############################################################################################################
#                                                                                                           #
# 为了减少重复配置，本配置文件为此solvela-admin的独有配置，更多配置请查看 solvela-base 项目中的 solvela-base.yaml 通用配置文件。      #
# 其中此文件中配置可以覆盖 solvela-base.yaml 中的通用配置，具体实现类请看类：YamlProcessor.java                          #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: solvela-admin
  log-directory: ${localPath:/home}/logs/solvela/${project.name}/${spring.profiles.active}

# 项目端口和url根路径
server:
  port: 1024
  servlet:
    context-path: /

# -------------------------------------------------------------------------
# actuator 的独立端口（业务端口 + 1000）
#
# 🔴 必须独立端口，不能挂在业务端口上。两个原因：
#    ① /actuator/** 是网关安全闸的【蜜罐路径】之一（见 t_config 的
#       gateway_security_gate.honeypotPaths）。挂在业务端口上时，Prometheus
#       每抓一次就被当成扫描器，罚 IP 与设备 24 小时 —— 而响应和 404 一模一样，
#       两边都不报错，只是过一会儿发现自己被封了。
#    ② 独立端口让 Boot 建一个【独立的 management 子上下文和 servlet 容器】，
#       父上下文里那些 @Component 的 Filter（安检门、限流、设备令牌）都不会
#       注册进去，所以抓取既过不了安检门、也不计入限流。
#
# ⚠️ 这个端口【不对外发布】：docker-compose.yml 没有它的 ports，
#    deploy/k8s 里也没有 NodePort，nginx 没有任何到它的 proxy_pass。
#    只给同机 / 同集群的 Prometheus 用。
# -------------------------------------------------------------------------
management:
  server:
    port: 2024
# 自定义登录安全配置
solvela:
# -------------------------------------------------------------------------
  # SolvelaJob 定时任务
# -------------------------------------------------------------------------
  # 🔴 本块原在 solvela-base.yaml（2026-08-25 搬过来）。搬的理由：
  #    SolvelaJobConfig 这个 @ConfigurationProperties 已随 job 模块移交 solvela-admin，
  #    放在共享配置里会让 solvela-app 等其它服务背着一堆永远不会生效的键。
# ⚠️ 定时任务全局只应该有一个执行者。将来若拆出独立 WORKER 节点，
  #    用启动参数分角色（--solvela.job.role=ADMIN / WORKER），别两边都跑。
  job:
    enabled: true
    # 任务初始化延迟 默认30秒 可选
    init-delay: 10
    # 定时任务执行线程池数量 默认2 可选
    core-pool-size: 2
    # 数据库配置检测-开关 默认开启 可选（作用是固定间隔读取数据库配置更新任务，关闭后只能重启服务或通过接口修改定时任务，建议开启）
    db-refresh-enabled: true
    # 数据库配置检测-执行间隔 默认120秒 可选
    db-refresh-interval: 60
  login:
# 环境
spring:
  profiles:
    active: '@profiles.active@'