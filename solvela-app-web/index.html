<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <title>Solvela</title>
    <!--
      🔴 在 JS 加载【之前】就把主题打到 <html> 上。

      不这么做的话，深色模式用户每次打开都会先看到一下白屏 ——
      因为 CSS 的默认值是浅色，而 stores/theme.ts 要等整个 bundle
      下载解析完才跑得到。那一闪在深色下非常刺眼，而且它不是 bug，
      是「主题由 JS 决定」这个设计自带的。

      所以这段是内联的、同步的、放在 <head> 里的 —— 三个条件缺一不可。
      它和 stores/theme.ts 读的是同两个 key，那边是唯一真源，
      这里只是把结果提前几百毫秒。
    -->
    <script>
      ;(function () {
        try {
          var appearance = localStorage.getItem('solvela.app.appearance') || 'system'
          var skin = localStorage.getItem('solvela.app.skin') || 'default'
          if (appearance === 'system') {
            appearance = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          var root = document.documentElement
          root.dataset.appearance = appearance
          root.dataset.skin = skin
          root.style.colorScheme = appearance
        } catch (e) {
          // 隐私模式下 localStorage 会抛。什么都不做 —— CSS 的默认值就是浅色
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
