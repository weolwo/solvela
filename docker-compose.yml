# Solvela 一键部署。
#
#     cp .env.example .env     # 先把里面每一处 change-me 都改掉
#     docker compose up -d
#     docker compose logs -f admin
#
# ┌─ 进程拓扑 ────────────────────────────────────────────────────────────┐
# │                                                                      │
# │   公网 ──► Cloudflare 边缘 ──► cloudflared（隧道，出站连接）            │
# │                                    │                                 │
# │                                    ▼                                 │
# │            app.<域名>  ──►  web:8080 ─┬─► /            静态站(C端)      │
# │                                       ├─► /api/        app-gateway    │
# │                                       └─► /support/... admin（图片）   │
# │                                                                      │
# │          admin.<域名>  ──►  web:8081 ─┬─► /            静态站(管理端)   │
# │                                       └─► /api/        admin          │
# │                                                                      │
# │   app-gateway ──HTTP──► app-biz        （C端网关转发给C端业务）         │
# │   admin / app-biz ──► mysql / redis / minio                          │
# └──────────────────────────────────────────────────────────────────────┘
#
# 🔴 安全上最要紧的一条：**没有任何服务对公网发布端口**。
#
#    mysql / redis / minio 从一开始就没有 ports —— 写了 "3306:3306" 的机器
#    挂上公网当天就会被爆破。
#
#    三个后端进程和 web 也【一个都不发布】：外面唯一的入口是 cloudflared，
#    而隧道是【出站】连接 —— 你家路由器不需要开任何入站端口，
#    公网上也扫不到这台机器。这比"开个 443 加防火墙"要干净得多。
#
#    ⚠️ 这同时是 nginx 那份真实 IP 归一化能成立的前提：
#       只有 cloudflared 够得着 web，才能保证 CF-Connecting-IP 是 Cloudflare 写的。
#       一旦给 web 加上 ports 映射并对外开放，任何人都能直接伪造那个头。
#       要本地调试就用 127.0.0.1 前缀绑定（见 minio 那两行的写法）。
#
#    真要连库调试：ssh -L 3306:127.0.0.1:3306 user@server

# ---------------------------------------------------------------------------
# 三个后端进程共享的环境变量。
#
# 用锚点而不是各写一遍：这些值里有一半是【三个进程必须逐字一致】的 ——
# 尤其是设备令牌密钥（网关签发、admin 与 app-biz 验证，不一致的表现是
# 「网关签的令牌到下游验不过」，而两边日志都不报错）。
# 抄三遍就一定会有改漏的那天。
#
# ⚠️ 网关（app-gateway）用不到其中的数据库与加密密钥 —— 它 2026-09-01 摘掉了
#    全部 base 模块，连 MySQL 驱动都没有。多给几个没人读的环境变量是无害的，
#    而按进程裁剪清单的代价是「哪天网关要用了，忘了加」。
# ---------------------------------------------------------------------------
x-backend-env: &backend-env
  TZ: Asia/Shanghai

  # 覆盖 prod yaml 里写死的 127.0.0.1 —— 在容器里那指的是它自己
  SPRING_DATASOURCE_URL: >-
    jdbc:mysql://mysql:3306/solvela?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&allowMultiQueries=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---- 密钥。全部必填，缺一个就启动失败 ----
  # 这是刻意的：这几把钥匙给了默认值的话，忘配的人会用一个全世界都知道的密钥
  # 把用户地址加密进库、给设备签名 —— 功能完全正常，而整套设计的前提直接归零，
  # 且没有任何迹象。宁可起不来。各自的含义见 .env.example。
  SOLVELA_CRYPTO_PII_SECRET_KEY: ${SOLVELA_CRYPTO_PII_SECRET_KEY}
  SOLVELA_CRYPTO_PII_HMAC_KEY:   ${SOLVELA_CRYPTO_PII_HMAC_KEY}
  SOLVELA_MEMBER_ID_SECRET_KEY:  ${SOLVELA_MEMBER_ID_SECRET_KEY}
  SOLVELA_AUTH_DEVICE_KEY_V1:    ${SOLVELA_AUTH_DEVICE_KEY_V1}

  # ---- 发信 ----
  # ⚠️ Cloudflare Email Routing 只能【收】信，发信要单独的 SMTP 服务商。
  SMTP_HOST:     ${SMTP_HOST:-}
  SMTP_PORT:     ${SMTP_PORT:-465}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # 🔴 发件地址不等于 SMTP 用户名 —— Resend 的用户名是字面量 resend
  MAIL_FROM:     ${MAIL_FROM:-}

  # ---- 对象存储 ----
  FILE_STORAGE_MODE: ${FILE_STORAGE_MODE:-local}
  FILE_STORAGE_CLOUD_ENDPOINT: http://minio:9000
  FILE_STORAGE_CLOUD_BUCKET_NAME: ${MINIO_BUCKET:-solvela}
  FILE_STORAGE_CLOUD_ACCESS_KEY: ${MINIO_ROOT_USER}
  FILE_STORAGE_CLOUD_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  FILE_STORAGE_CLOUD_REGION: us-east-1
  FILE_STORAGE_CLOUD_PATH_STYLE_ACCESS: "true"

  # 🔴 C 端图片的 URL 前缀。桶是私有的，图片由 admin 进程从 MinIO 流出来，
  #    所以这里填的是【C 端自己的域名】+ 那个免登录端点，而不是 MinIO 地址。
  #    不填的话所有图片会退回要登录态的下载接口 —— 管理端还能看，C 端全是叉。
  FILE_STORAGE_PUBLIC_URL_PREFIX: ${FILE_STORAGE_PUBLIC_URL_PREFIX:-}

x-backend-common: &backend-common
  restart: unless-stopped
  build:
    context: ./solvela-api
    dockerfile: Dockerfile.distroless

# ⚠️ depends_on 【不放】在上面的锚点里：YAML 的 << 合并是整键覆盖，
#    服务里再写一个 depends_on 会把锚点那份整个顶掉而不是合并 ——
#    表现是「明明写了等 mysql，还是起来就连不上库」。所以三个服务各写各的。


services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置}
      # 给 initdb 脚本一个默认库上下文：t_menu.sql / task.sql / activity.sql / lottery.sql
      # 这四个脚本自己不带 USE 语句，没有这行会建到错误的库里去
      MYSQL_DATABASE: solvela
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 旧基线（MySQL 8.0.26 导出）含 115 处 int(0) 这类已废弃写法，需要放宽 sql-mode。
      # 新基线是从 8.4 现导的，零处废弃语法 —— 这行留着只为兼容手工导入老脚本的场景。
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      # ⚠️ 只在【数据卷为空】时执行一次。之后改这些文件不会生效，
      #    要重新导入必须 docker compose down -v（会删数据，谨慎）。
      #    文件名前缀决定执行顺序。
      #
      # 2026-08-22 起只需两个基线文件。此前这里挂 5 个 schema 文件 + 一个回放
      # 45 个增量脚本的 shell —— 那套流水线的问题是「建出来的库对不对」取决于
      # 增量有没有全、顺序对不对，而增量里有 17 个含种子数据（光菜单就横跨 8 个文件）。
      # 现在两个基线都是从真库现导 + 空库验证过的，见 数据库SQL脚本/mysql/README.md。
      - ./数据库SQL脚本/mysql/schema-baseline.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./数据库SQL脚本/mysql/data-baseline.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # 用 root 密码真连一次，而不是只看端口通 —— initdb 期间端口早就通了，
      # 但那时库还没建好，app 连上去会一头撞进空库。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # 调试用，平时保持注释：
    # ports:
    #   - "127.0.0.1:3306:3306"   # 只绑回环，配合 SSH 隧道

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 里设置}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    # ⚠️ noeviction 而不是 allkeys-lru：Redis 里放的是 Sa-Token 会话和分布式锁，
    #    内存满了宁可写失败报错，也不能让锁被悄悄淘汰 —— 那是超卖类事故的源头。
    environment:
      TZ: Asia/Shanghai
      # 只为让 healthcheck 里的 redis-cli 能取到密码，不传给 redis-server 本身
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────────────────────────────────────────────────
  # 对象存储。图片和附件放这里，不再落在应用容器的磁盘上。
  #
  # 🔴 为什么要它：mode=local 时文件写在 app 容器的 /home/solvela/upload。
  #    那意味着应用一换机器/一重建镜像，图就没了；也没法多副本 —— 两个 app
  #    各写各的盘，用户传的图有一半刷不出来。
  #
  # ⚠️ 和 mysql/redis 一样【不对公网映射端口】。9000 只在内网里对 app 可见，
  #    9001 那个控制台默认也只绑回环，本地调试用。
  # ────────────────────────────────────────────────────────────────────
  minio:
    # 🔴 从 quay.io 拉，不是 Docker Hub。
    #    2026-09-12 实测：docker.io/minio/minio 在本机被拒（pull access denied），
    #    而同一台机器上 localstack、adobe/s3mock 这些非官方镜像都拉得动 ——
    #    所以不是「非官方镜像一律禁」那种策略问题。quay.io 是 MinIO 自己的另一个
    #    发布源，拉得到。哪天 Docker Hub 那条恢复了，换回去也行。
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 里设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 里设置}
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    ports:
      # 只绑回环：本地开发要用浏览器开控制台，以及让【跑在容器外】的
      # dev 后端连得上 9000。生产上把这两行去掉。
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 一次性任务：建桶。跑完就退出，不常驻。
  #
  # 🔴 桶【保持私有】，不设 anonymous download。
  #    这个系统的文件分类上有 public_flag，公开与否是【一条一条】定的；
  #    把整个桶开成公共读，等于所有私有附件（身份证、凭证）也一起裸奔。
  #    C 端要看的公开图走应用的 /support/file/public/，那条路会校验 public_flag；
  #    私有文件走预签名 URL。两条都不需要桶是公共的。
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-solvela}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo '[minio-init] 桶已就绪：'$$MINIO_BUCKET' （保持私有，不开匿名读）'
      "
    restart: "no"

  # =========================================================================
  # 管理端 :1024 —— 也是文件模块与定时任务的所在地
  # =========================================================================
  admin:
    <<: *backend-common
    build:
      context: ./solvela-api
      dockerfile: Dockerfile.distroless
      args:
        MODULE: solvela-admin
        APP_PORT: "1024"
    image: solvela-admin:3.0.0-distroless
    environment:
      <<: *backend-env
      HEALTH_URL: http://127.0.0.1:1024/
    depends_on:
      mysql:
        condition: service_healthy   # 等库真的建好，不是等端口通
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - admin-logs:/home/logs
      # FILE_STORAGE_MODE=local 时文件落在这里。切到 cloud 之后这个卷就只剩历史文件，
      # 但【不要删】：切换之前上传的那些，storageKey 还指向本地磁盘。
      - admin-upload:/home/solvela/upload
    # 实测：限 1GB 能正常启动，稳态占用 529MB。
    deploy:
      resources:
        limits:
          memory: ${ADMIN_MEMORY:-1g}

  # =========================================================================
  # C 端网关 :1025 —— 唯一直面 C 端用户的后端进程
  # =========================================================================
  # 它没有数据库驱动、没有 base 模块（2026-09-01 摘干净的），
  # 只连 Redis（会话与身份缓存），业务一律转发给 app-biz。
  app-gateway:
    <<: *backend-common
    build:
      context: ./solvela-api
      dockerfile: Dockerfile.distroless
      args:
        MODULE: solvela-app
        APP_PORT: "1025"
    image: solvela-app:3.0.0-distroless
    environment:
      <<: *backend-env
      HEALTH_URL: http://127.0.0.1:1025/
      # 两个键刻意都留着、都指向 app-biz：网关认的是 MemberAuthApi / ActivityApi
      # 两个契约，将来资产域真拆出去时只改这里的一个 URL，代码一行不动。
      MEMBER_SERVICE_URL: http://app-biz:1026
      MARKETING_SERVICE_URL: http://app-biz:1026
    depends_on:
      redis:
        condition: service_healthy
      app-biz:
        condition: service_healthy
    volumes:
      - gateway-logs:/home/logs
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEMORY:-768m}

  # =========================================================================
  # C 端业务 :1026 —— 会员、营销、奖品、资产、商城
  # =========================================================================
  # 只被 app-gateway 调用，不对外。**不开定时任务**（那是 admin 独占的，
  # 多一个进程跑 @Scheduled 就是发奖和结算重复执行，而多发的那份没人会来报）。
  app-biz:
    <<: *backend-common
    build:
      context: ./solvela-api
      dockerfile: Dockerfile.distroless
      args:
        MODULE: solvela-app-biz
        APP_PORT: "1026"
    image: solvela-app-biz:3.0.0-distroless
    environment:
      <<: *backend-env
      HEALTH_URL: http://127.0.0.1:1026/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - biz-logs:/home/logs
    deploy:
      resources:
        limits:
          memory: ${BIZ_MEMORY:-1g}

  # =========================================================================
  # 静态站 + 反向代理。:8080 = C端，:8081 = 管理端
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: solvela-web:3.0.0
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      app-gateway:
        condition: service_healthy
    # ⚠️ 刻意【不发布端口】。理由见文件开头那段 —— 这是 nginx 那份
    #    真实 IP 归一化能成立的前提。本地要看页面就临时加一行
    #    "127.0.0.1:8080:8080"，用完删掉。
    volumes:
      # 🔴 管理端 Basic Auth 的口令文件（bcrypt）。挂载进来、不进镜像 ——
      #    进镜像等于把口令随镜像分发。文件缺失时 nginx 对 :8081 的请求会 500，
      #    这是刻意的「fail closed」：宁可管理端打不开，也不要没密码就敞开。
      #    生成方式见 deploy/README.md。
      - ./deploy/nginx/admin.htpasswd:/etc/nginx/admin.htpasswd:ro
    healthcheck:
      # alpine 自带 busybox wget；这个镜像里没有 curl
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================================
  # Cloudflare 隧道。整套部署里唯一与公网有关的东西
  # =========================================================================
  # 它建立的是【出站】连接，所以路由器不用开任何入站端口，公网也扫不到这台机器。
  #
  # 路由规则（哪个域名去哪个端口）在 deploy/cloudflared/config.yml 里，
  # 跟着代码库走 —— 而不是在 Cloudflare 控制台点出来的。
  # 点出来的配置没人 review、换机器要重点一遍、出问题时也看不出改过什么。
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 不锁版本：隧道客户端要跟着 Cloudflare 的协议走，锁死版本迟早连不上。
    # --no-autoupdate 是因为容器里自更新没意义（重建镜像才是升级方式）。
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # 隧道凭据。`cloudflared tunnel create` 生成的那个 json，
      # 默认在 ~/.cloudflared/<隧道UUID>.json。
      # 🔴 这个文件【不要提交】—— .gitignore 里已经挡了。
      - ./deploy/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro

volumes:
  mysql-data:
  redis-data:
  minio-data:
  # 三个进程各自的日志卷。合成一个的话，三份 Spring 日志会写进同一个目录，
  # 而它们的文件名是一样的（按 project.name 分了子目录，但轮转文件会打架）。
  admin-logs:
  gateway-logs:
  biz-logs:
  admin-upload:
