# Solvela 一键部署：MySQL + Redis + 后端
#
#     cp .env.example .env     # 先改掉里面的密码
#     docker compose up -d
#     docker compose logs -f app
#
# ⚠️ 安全上最要紧的一条：mysql 和 redis 都【没有】ports 映射。
#    它们只在 compose 创建的内网里对 app 可见，公网上扫不到。
#    很多人图省事写了 "3306:3306"，机器挂上公网当天就会被爆破 —— 不要加。
#    真要连库调试，用 SSH 隧道：
#        ssh -L 3306:127.0.0.1:3306 user@server   # 配合下面注释里的临时 ports

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置}
      # 给 initdb 脚本一个默认库上下文：t_menu.sql / task.sql / activity.sql / lottery.sql
      # 这四个脚本自己不带 USE 语句，没有这行会建到错误的库里去
      MYSQL_DATABASE: solvela
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 旧基线（MySQL 8.0.26 导出）含 115 处 int(0) 这类已废弃写法，需要放宽 sql-mode。
      # 新基线是从 8.4 现导的，零处废弃语法 —— 这行留着只为兼容手工导入老脚本的场景。
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      # ⚠️ 只在【数据卷为空】时执行一次。之后改这些文件不会生效，
      #    要重新导入必须 docker compose down -v（会删数据，谨慎）。
      #    文件名前缀决定执行顺序。
      #
      # 2026-08-22 起只需两个基线文件。此前这里挂 5 个 schema 文件 + 一个回放
      # 45 个增量脚本的 shell —— 那套流水线的问题是「建出来的库对不对」取决于
      # 增量有没有全、顺序对不对，而增量里有 17 个含种子数据（光菜单就横跨 8 个文件）。
      # 现在两个基线都是从真库现导 + 空库验证过的，见 数据库SQL脚本/mysql/README.md。
      - ./数据库SQL脚本/mysql/schema-baseline.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./数据库SQL脚本/mysql/data-baseline.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # 用 root 密码真连一次，而不是只看端口通 —— initdb 期间端口早就通了，
      # 但那时库还没建好，app 连上去会一头撞进空库。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # 调试用，平时保持注释：
    # ports:
    #   - "127.0.0.1:3306:3306"   # 只绑回环，配合 SSH 隧道

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 里设置}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    # ⚠️ noeviction 而不是 allkeys-lru：Redis 里放的是 Sa-Token 会话和分布式锁，
    #    内存满了宁可写失败报错，也不能让锁被悄悄淘汰 —— 那是超卖类事故的源头。
    environment:
      TZ: Asia/Shanghai
      # 只为让 healthcheck 里的 redis-cli 能取到密码，不传给 redis-server 本身
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────────────────────────────────────────────────
  # 对象存储。图片和附件放这里，不再落在应用容器的磁盘上。
  #
  # 🔴 为什么要它：mode=local 时文件写在 app 容器的 /home/solvela/upload。
  #    那意味着应用一换机器/一重建镜像，图就没了；也没法多副本 —— 两个 app
  #    各写各的盘，用户传的图有一半刷不出来。
  #
  # ⚠️ 和 mysql/redis 一样【不对公网映射端口】。9000 只在内网里对 app 可见，
  #    9001 那个控制台默认也只绑回环，本地调试用。
  # ────────────────────────────────────────────────────────────────────
  minio:
    # 🔴 从 quay.io 拉，不是 Docker Hub。
    #    2026-09-12 实测：docker.io/minio/minio 在本机被拒（pull access denied），
    #    而同一台机器上 localstack、adobe/s3mock 这些非官方镜像都拉得动 ——
    #    所以不是「非官方镜像一律禁」那种策略问题。quay.io 是 MinIO 自己的另一个
    #    发布源，拉得到。哪天 Docker Hub 那条恢复了，换回去也行。
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 里设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 里设置}
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    ports:
      # 只绑回环：本地开发要用浏览器开控制台，以及让【跑在容器外】的
      # dev 后端连得上 9000。生产上把这两行去掉。
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 一次性任务：建桶。跑完就退出，不常驻。
  #
  # 🔴 桶【保持私有】，不设 anonymous download。
  #    这个系统的文件分类上有 public_flag，公开与否是【一条一条】定的；
  #    把整个桶开成公共读，等于所有私有附件（身份证、凭证）也一起裸奔。
  #    C 端要看的公开图走应用的 /support/file/public/，那条路会校验 public_flag；
  #    私有文件走预签名 URL。两条都不需要桶是公共的。
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-solvela}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo '[minio-init] 桶已就绪：'$$MINIO_BUCKET' （保持私有，不开匿名读）'
      "
    restart: "no"

  app:
    build:
      context: ./solvela-api
      dockerfile: Dockerfile.distroless
    image: solvela-admin:3.0.0-distroless
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # 等库真的建好，不是等端口通
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 覆盖 prod/solvela-base.yaml 里写死的 127.0.0.1 —— 容器里那是它自己
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/solvela?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ---- 对象存储（MinIO）----
      #
      # 这个镜像跑的是 **prod** 配置，而 prod/solvela-base.yaml 里的 cloud 那一段
      # 是对着公有云写的。所以这里【每一项都要显式覆盖】，不能指望 yaml 的默认值。
      # （dev 那份 yaml 是对着 MinIO 写的，从 IDE 起的时候什么都不用配 ——
      #   两边命名不同是因为面对的是两份 yaml，不是随手写的，别去「统一」。）
      #
      # ⚠️ 容器内用服务名 minio:9000，不是 127.0.0.1 —— 那在容器里指它自己。
      #    要让应用真的用对象存储，还得把 FILE_STORAGE_MODE 改成 cloud，
      #    见 .env.example 里那一段。
      FILE_STORAGE_MODE: ${FILE_STORAGE_MODE:-local}
      FILE_STORAGE_CLOUD_ENDPOINT: http://minio:9000
      FILE_STORAGE_CLOUD_BUCKET_NAME: ${MINIO_BUCKET:-solvela}
      FILE_STORAGE_CLOUD_ACCESS_KEY: ${MINIO_ROOT_USER}
      FILE_STORAGE_CLOUD_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # MinIO 不分区域，但 SigV4 的签名里带着它，两边对不上会被拒。
      # prod yaml 里写的是 oss-cn-hangzhou，必须覆盖掉。
      FILE_STORAGE_CLOUD_REGION: us-east-1
      # 🔴 本地对象存储必须走路径寻址，见 FileConfig.cloudPathStyleAccess。
      #    这里【尤其】不能漏：endpoint 是主机名 minio，虚拟主机寻址会去解析
      #    solvela.minio —— 报 UnknownHostException，看着像网络坏了。
      #    （本机用 127.0.0.1 时这一项配错也看不出来：IP 没有子域名，
      #      SDK 会自己退回路径寻址。这就是「本机好好的，一进容器图全挂」。）
      FILE_STORAGE_CLOUD_PATH_STYLE_ACCESS: "true"
    ports:
      # 只有这一个对外。上了域名和 HTTPS 之后改成 "127.0.0.1:1024:1024"，
      # 由 nginx/caddy 反代，别让应用端口直接对公网。
      - "${APP_PORT:-1024}:1024"
    volumes:
      - app-logs:/home/logs
      - app-upload:/home/solvela/upload
    # 实测：限 1GB 能正常启动，稳态占用 529MB。
    # 1GB 内存的小机器上 MySQL 也要 ~400MB，三个服务挤一台会 OOM —— 建议 2GB 起。
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY:-1g}

volumes:
  mysql-data:
  redis-data:
  minio-data:
  app-logs:
  app-upload:
